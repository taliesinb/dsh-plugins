# Dev overlay for the STANDING PREVIEW server (see PREVIEWING.md).
#
# The preview runs against its own home, ~/.dsh-preview (never the live
# ~/.dsh), started on demand by the relay LaunchAgent
# io.github.taliesinb.dsh-web-relay.preview as
#   DSH_HOME=~/.dsh-preview pnpm dsh --profile web --patch <this file> --no-open --port 3088
# Composition = profile bundles + ~/.dsh-preview/profiles/web/cordis.patch.yml
# + this overlay. That profile patch owns the preview's standing rows —
# tali-tailscale-remote (relay :3085 → proxy :3086, /dsh-preview, DSH Preview.app),
# tali-local-model-supervisor (Apple Foundation via afm :9997) and
# tali-enforce-model-preset (local models → minimal presets) — so do NOT
# repeat those ids here (duplicate id = boot failure; renamed id = loaded twice).
# This overlay is the COMPLEMENT: the plugins under trial. After editing it,
#   launchctl kickstart -k gui/$UID/io.github.taliesinb.dsh-web-relay.preview
# (host rows are not hot-reloaded; client bundles are).
#
# Paths MUST be absolute (a patch contributes config; it does not move the
# loader's module-resolution root). Machine-specific by design.
- insert:
    # Preview-only identity: red whale + "DSH-dev" title so the preview is
    # never confused with the live server.
    - id: tali-preview-identity
      name: '/Users/tali/github/tali-dash-plugins/plugins/preview-identity/index.js'
