# Dev-instance additions, applied ON TOP OF the live web profile.
#
# The preview server runs with `pnpm dsh web --patch <this file> --port 3081`
# against the LIVE home (~/.dsh), so its composition is: profile bundles +
# ~/.dsh/profiles/web/cordis.patch.yml + this overlay. A plugin already
# installed in the live profile must therefore NOT be repeated here — a second
# row with the same id fails the boot with "duplicate loader entry id", and a
# renamed id would load the plugin twice (double tools, double servers).
#
# Live profile owns: enforce-model-preset, browser-automation, dash-docsets,
# local-model-supervisor, notion-mcp, wolfram-kernel-supervisor,
# foreign-link-opener, settings-shortcut, session-introspect, session-title-slug
# (2026-09-16),
# fs-tools (2026-09-16), tailscale-remote (2026-09-16; it also binds 127.0.0.1:3083 and owns the /dsh
# serve route, so a preview must not load it — or must set another
# listenPort/mountPath).
# This overlay only adds what is NOT there: agent-status-indicator and the
# preview-only red identity.
#
# For a fully ISOLATED throwaway-home preview (see PREVIEWING.md) this file is
# intentionally incomplete — copy the live-profile rows here for that flow.
# Paths MUST be absolute (a patch contributes config; it does not move the
# loader's module-resolution root). Machine-specific by design.
- insert:
    - id: tali-agent-status-indicator
      name: '/Users/tali/github/tali-dash-plugins/plugins/agent-status-indicator/index.js'
    # Preview-only identity: red whale + "DSH-dev" so a Dock-installed preview
    # instance is never confused with the live server. Dev overlay ONLY.
    - id: tali-preview-identity
      name: '/Users/tali/github/tali-dash-plugins/plugins/preview-identity/index.js'

# Preview instance of the Tailscale remote (the row itself is installed in the
# live profile; this overrides its config for the preview server only).
# Preview pair beside the live one: DSH Preview.app (red icon) →
# https://<node>/dsh-preview/ → relay :3085 (LaunchAgent
# io.github.taliesinb.dsh-web-relay.preview) → proxy :3086 → dsh web :3088
# (live home + this overlay). State: ~/.dsh/tailscale-remote-preview.json,
# logs ~/.dsh/logs/{relay,dsh-web}-preview.log. Recipe: recipes/dock-app-via-tailnet.md
- id: tali-tailscale-remote
  config:
    instance: preview
    listenPort: 3086
    publishPort: 3085
    mountPath: /dsh-preview
    dockAppName: DSH Preview
    dockAppGlyphColor: '#E5484D'
    relayCwd: /Users/tali/github/deepseek-harness
    relayStart: pnpm dsh --profile web --patch /Users/tali/github/tali-dash-plugins/cordis.dev.yml --no-open --port 3088
