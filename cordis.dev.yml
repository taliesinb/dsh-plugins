# Dev overlay for the STANDING PREVIEW server (see PREVIEWING.md).
#
# THIS FILE IS A TEMPLATE: the loader needs absolute module paths and this
# repo lives somewhere else on every machine, so the rows carry the
# placeholder prefix /Users/USER/github/tali-dash-plugins and `pnpm dev-overlay`
# (tools/dev-overlay.sh) writes cordis.dev.local.yml (gitignored) with the real
# one. Everything loads the GENERATED file. Edit this one, then regenerate.
#
# The preview runs against its own home, ~/.dsh-preview (never the live
# ~/.dsh), started on demand by the relay LaunchAgent
# io.github.taliesinb.dsh-web-relay.preview as
#   DSH_HOME=~/.dsh-preview pnpm dsh --profile web --patch <plugins>/cordis.dev.local.yml --no-open --port 3088
# Composition = profile bundles + ~/.dsh-preview/profiles/web/cordis.patch.yml
# + this overlay. That profile patch owns the preview's standing rows —
# tali-tailscale-remote (relay :3085 → proxy :3086, /dsh-preview, DSH Preview.app),
# tali-local-model-supervisor (Apple Foundation via afm :9997) and
# tali-enforce-model-preset (local models → minimal presets) — so do NOT
# repeat those ids here (duplicate id = boot failure; renamed id = loaded twice).
# This overlay is the COMPLEMENT: the plugins under trial. After editing it,
#   launchctl kickstart -k gui/$UID/io.github.taliesinb.dsh-web-relay.preview
# (host rows are not hot-reloaded; client bundles are).
#
# Paths MUST be absolute (a patch contributes config; it does not move the
# loader's module-resolution root) — hence the placeholder + generated copy.
- insert:
    # Instance identity: "DSH Preview" wordmark + window title, red sidebar
    # whale + favicon and a "DSH-dev" web-app manifest so the preview is never
    # confused with the live server; the build-version chip is quiet
    # (default). Live/remote profiles get the same plugin as a BUNDLE
    # (pnpm install-plugins) — never both for one home.
    - id: tali-instance-identity
      name: '/Users/USER/github/tali-dash-plugins/plugins/instance-identity/index.js'
      config:
        label: DSH Preview
        brandColor: '#E5484D'
        dockLabel: DSH-dev
    # symba-dsh under trial (2026-09-21): the Symba CLI as symba_* tools. Lives
    # in the PRIVATE symbolica-ai/symba repo (branch tali/dsh-plugin,
    # integrations/dsh/), not in this repo. Handles persist in
    # ~/.dsh-preview/symba-dsh.json. It talks to production Forge with the maintainer's
    # tailnet identity — creating a node from the preview costs real money.
    # Installed as a BUNDLE into the preview profile instead of a row here
    # (only bundles get a Plugins-panel page for their card):
    #   DSH_HOME=~/.dsh-preview pnpm dsh plugin --profile web add ~/github/symba/integrations/dsh
    # (never both — duplicate id fails the boot). Row form, for host-only trials:
    # - id: symba-dsh
    #   name: '/Users/USER/github/symba/integrations/dsh/index.js'
    # (numbered-switching was trialed here 2026-09-21 together with
    # dsh-remote-workspaces — the preview mirrored itself as a remote via the
    # control channel; state persists in ~/.dsh-preview/remote-workspaces.json.
    # Both promoted to the live profile as bundles; re-add rows here to trial
    # further changes. Recipe: recipes/numbered-session-switching-plugin.md)
    # (2026-09-21: session-title-slug's post-rebase ghost bug was reproduced and
    # fixed here from a /tmp COPY of the plugin — `name: /tmp/sts-preview/index.js`
    # — so the live bundle was not hot-swapped mid-investigation; see
    # recipes/session-title-slug-plugin.md. Never leave a /tmp row in: it
    # evaporates on reboot and a dsh.client row with a missing lib/client.js
    # fails the boot.)
    # Under trial (2026-09-21 evening): numbered-switching — badge stylesheet
    # lost after a plugin re-apply (reconnect / hot-swap); same lib/client.js
    # as the live bundle, so a rebuild hot-swaps both.
    - id: tali-numbered-switching
      name: '/Users/USER/github/tali-dash-plugins/plugins/numbered-switching/index.js'
    # Under trial (2026-09-28): `%` opens a recent-first ordinary-session picker.
    - id: tali-session-reference-picker
      name: '/Users/USER/github/tali-dash-plugins/plugins/session-reference-picker/index.js'
    # Under trial (2026-09-22): reload-on-restart — a server restart re-mints
    # every client bundle rev, client-hmr then hot-swaps the whole plugin tree
    # and the React root crashes (black window in the Dock apps). The plugin
    # reloads the page instead. Recipe: recipes/black-screen-after-server-restart.md
    - id: tali-reload-on-restart
      name: '/Users/USER/github/tali-dash-plugins/plugins/reload-on-restart/index.js'
    # Under trial (2026-09-22): transcript-grace-margin — 160px of empty space
    # under the transcript's last row so the end of a long session is
    # unmistakable (host-only <style> row). Recipe: recipes/transcript-grace-margin.md
    - id: tali-transcript-grace-margin
      name: '/Users/USER/github/tali-dash-plugins/plugins/transcript-grace-margin/index.js'
    # Under trial (2026-09-23): phone-ui — below 640px viewport width hide the
    # Session header (+ Chat/Trajectory tabs), the per-message icon rows and
    # the composer stats dock, drop the side margins to 8px, hide code-block
    # banners and halve code-block/bubble rounding, so a phone (full GUI or
    # the per-session QR code's ?embed page) shows only transcript + composer
    # (host-only <style> row). Recipe: recipes/phone-ui.md
    - id: tali-phone-ui
      name: '/Users/USER/github/tali-dash-plugins/plugins/phone-ui/index.js'
    # Under trial (2026-09-23): wait-tool — a `wait` tool replacing bash
    # `sleep N`, rendered in the chat as a live progress bar with Skip (return
    # early, as if elapsed) and Abort ("user aborted sleep" error). The preview's
    # default model has no tools, so pick an LM Studio model (minimal preset) to
    # see a call; the UI half hot-swaps from `pnpm watch`. Recipe:
    # recipes/wait-tool-plugin.md
    - id: tali-wait-tool
      name: '/Users/USER/github/tali-dash-plugins/plugins/wait-tool/index.js'
    # Under trial (2026-09-23): reboot-command — `/reboot` restarts this dsh web
    # from inside a session: host command (/reboot now|wait|cancel, logged like
    # /compact) + a dialog on the bare /reboot listing every session a reboot
    # would interrupt, whether the relay brings DSH back (via
    # dsh-tailscale-remote's `tailscaleRemoteRelay` service — its host half
    # changed too, so this kickstart is what loads it), Wait (fire once every
    # session is idle) and Reboot now. Recipe: recipes/reboot-command.md
    - id: tali-reboot-command
      name: '/Users/USER/github/tali-dash-plugins/plugins/reboot-command/index.js'
    # Under trial (2026-09-24): chat-title — a rename_chat tool plus a
    # system-prompt rule and an untitled-chat runtime-context nudge that make
    # the agent name the chat right after the first message that states the
    # task (host-only). The preview's default model has no tools, so the tool
    # path was verified headlessly instead; recipe: recipes/chat-title-plugin.md
    - id: tali-chat-title
      name: '/Users/USER/github/tali-dash-plugins/plugins/chat-title/index.js'
    # Under trial (2026-09-24): import-sessions — `/import-claude` and
    # `/import-pi` bring Claude Code / pi transcripts from disk into real DSH
    # sessions: chooser on the client device (upload) or on the server, one
    # decision modal (tree or single card, directory-matched workspace
    # destinations, working-session fold offered for large sessions), written
    # through sessionPersistence/attachments/workspaceRegistry. Recipe:
    # recipes/import-claude-code-sessions.md
    - id: tali-import-sessions
      name: '/Users/USER/github/tali-dash-plugins/plugins/import-sessions/index.js'

    # Backup/restore trial: bare /restore opens the backup selector; /backup
    # writes a complete preview-home ZIP under ~/.dsh-preview-backups.
    - id: tali-backup-restore
      name: '/Users/USER/github/tali-dash-plugins/plugins/backup-restore/index.js'
    # Under trial (2026-09-29): message-stash — a stash for unsent composer
    # messages: Ctrl+S pushes the draft, Ctrl+S,S opens the stash view, Ctrl+R
    # cycles stashed messages through the composer (an entry is popped only
    # when it is actually sent; edits made while cycling are written back).
    # Browser half only; the stash lives in localStorage. Recipe:
    # recipes/message-stash-plugin.md
    - id: tali-message-stash
      name: '/Users/USER/github/tali-dash-plugins/plugins/message-stash/index.js'
