# Bundle patch (used when installed with `dsh plugin --profile <name> add`).
# Defaults: proxy on 127.0.0.1:3083, route https://<node>/dsh/ (port 443),
# state + token in $DSH_HOME/tailscale-remote.json. Override `config` in the
# profile's cordis.patch.yml (a later layer replaces the whole value).
- insert:
    - id: tali-tailscale-remote
      name: dsh-tailscale-remote
